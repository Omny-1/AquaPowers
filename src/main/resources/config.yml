# ============================================================
#  AquaPowers — манипуляция водой (Святая Вода)
#  Размер, урон и последствия атак масштабируются от количества
#  набранной воды И от того, где ты стоишь (см. environment).
# ============================================================

# Версия конфига — не трогай. При обновлении плагина в файл ДОЛИВАЮТСЯ только
# новые ключи, твои значения сохраняются (бэкап всё равно пишется рядом).
config-version: 7

messages:
  prefix: "&b&l⊙ &b"

collect:
  radius: 16              # радиус поиска воды (блоков)
  duration-ticks: 40      # длительность сбора шара (20 = 1 сек) -> 2 сек
  # Максимум капель в шаре. Это главная ручка нагрузки: каждая капля — реальная
  # сущность, которую сервер рассылает всем игрокам рядом. Пять бендеров в одном
  # радиусе трекинга — это не 5 потоков пакетов, а 25.
  max-blocks: 120
  min-blocks: 6           # минимум, иначе способность не активируется
  drain-source: true      # убирать настоящую воду из мира при сборе
  restore-source-on-disperse: true  # вернуть воду, если шар развеян без атаки

orb:
  # Палитра шара: "МАТЕРИАЛ:вес". Смесь оттенков + белая "пена" — именно это
  # превращает кучу одинаковых кубов в массу воды.
  # Заметь: стекло прозрачное, и много перекрывающихся прозрачных капель дают
  # артефакты сортировки при вращении камеры. Если мерцает — попробуй
  # непрозрачные материалы (PRISMARINE, PACKED_ICE), потеряв немного "воды".
  # Контрастная палитра (тёмно-синий + белая пена) также лучше переживает
  # сжатие видео, чем три близких оттенка голубого.
  palette:
    - "BLUE_STAINED_GLASS:7"
    - "LIGHT_BLUE_STAINED_GLASS:3"
    - "WHITE_STAINED_GLASS:2"
  material: BLUE_STAINED_GLASS   # запасной вариант, если палитра пуста
  block-scale: 0.6        # базовый размер капли (растёт с количеством воды)
  size-jitter-min: 0.72   # разброс размера капель: без него видна "решётка"
  size-jitter-max: 1.36
  radius: 1.7             # базовый радиус шара (растёт с количеством воды)
  height-above-head: 1.0  # зазор над головой (шар авто-поднимается с ростом размера)
  spin-speed: 0.06
  glow: false             # светящийся контур капель (эпично, но видно сквозь стены)

display:
  # Клиентское отсечение по дальности. 4.0 заставляло клиент РИСОВАТЬ всю воду
  # со всех концов боя — далёкие игроки платили GPU за капли, которые всё равно
  # не различают. 1.5 достаточно, чтобы видеть свою и чужую воду в бою.
  view-range: 1.5
  teleport-duration: 2    # как часто шлём перемещение капли (тиков)
  # 0..15 — фиксированная яркость. -1 = брать освещение оттуда, где вода реально
  # находится: в пещере темнее, ночью темнее, на закате теплее.
  brightness: -1

# ---- Потолок нагрузки. Превышение = честный отказ с сообщением, а не тихие лаги ----
limits:
  max-effects: 90            # одновременно живых эффектов на сервер
  max-effects-per-player: 14
  max-displays: 1400         # одновременно живых капель-сущностей на сервер
  restore-batch: 120         # блоков за тик при возврате заимствованного

cooldown-ticks: 10        # задержка между применениями форм

# ---- Стамина: время набора полной (0->100) зависит от «стихии» вокруг ----
# Сухо и жарко -> быстро копится, но каст дорогой и слабый.
# Мокро -> копится медленно, но каст дешёвый и мощный. См. environment.
stamina:
  max: 100.0
  scan-radius: 6
  seconds-near-water: 30  # погружение / рядом много воды
  seconds-on-ground: 15   # обычная земля
  seconds-on-sand: 10     # песок / пустыня / саванна
  seconds-near-lava: 5    # лава, огонь, Ад

# ---- Стихия: окружение меняет стоимость И МОЩЬ способностей ----
# Погружение ×0.55 стоимость / ×1.30 мощь | Ливень ×0.70 / ×1.18
# Течение    ×0.80 / ×1.12 | Равновесие ×1.00 / ×1.00
# Сушь       ×1.30 / ×0.90 (шар испаряется) | Пекло ×1.70 / ×0.78 (испаряется быстро)
# Определяется по температуре биома и доступу к небу, не по названиям — работает
# и с модовыми биомами. Биомы без осадков (саванна, бэдленды) Ливень не получают.
environment:
  enabled: true
  sky-collection: true    # под дождём/под водой можно набрать шар без водоёма рядом

# ---- Авакенинг: копится от нанесённого урона, спадает в простое ----
awakening:
  enabled: true
  threshold: 80.0         # сколько "заряда" нужно, чтобы войти в авакенинг
  max: 100.0
  charge-per-damage: 1.3  # заряд за единицу нанесённого урона
  decay-per-sec: 3.0      # как быстро заряд спадает без урона
  grace-ticks: 60         # сколько после удара заряд не спадает
  cost-multiplier: 0.5    # множитель стоимости способностей в авакенинге
  collect-speed-mult: 2.0 # во сколько раз быстрее собирается вода в авакенинге
  # Множитель мощи. Влияет на урон, радиус, длительность и количество снарядов —
  # раньше он молча не влиял ни на что при полном шаре.
  power-multiplier: 1.25

# ---- Ультимейт "Аква-Армагеддон" (только в авакенинге, при полной стамине) ----
# Взвод БЕСПЛАТЕН и обратим: если не сбросить, вся изъятая вода возвращается в мир.
nuke:
  enabled: true
  radius: 60              # радиус сбора воды (только загруженные чанки)
  cooldown-seconds: 300   # 5 минут; считается в тиках сервера, не по стенным часам
  break-radius: 22        # радиус разрушения гриба-взрыва
  damage: 220.0
  cap-radius: 15          # радиус "шляпки" гриба
  height: 32              # высота столба гриба
  # Сколько капель рисуют облако. Силуэт гриба читается ровно настолько, насколько
  # велико это число: раньше вдали от океана оставалось 40 капель и гриба было
  # практически не видно. Недостающие «конденсируются из воздуха».
  cloud-blocks: 340
  cloud-scale: 1.8        # размер капли облака (крупнее = плотнее силуэт)
  # Кратер собирается как ОБЪЕДИНЕНИЕ множества под-взрывов, а не одна ровная чаша:
  # получаются лопасти, гребни между воронками, рваный край и уцелевшие столбы внутри.
  # 0 = вернуться к одной гладкой чаше.
  blast-count: 18
  blast-roughness: 0.55   # 0..1 — неровность под-взрывов и частота уцелевших столбов

damage:
  enabled: true
  friendly-fire: true     # можно ли бить других игроков; влияет и на то, кого лечат
  global-multiplier: 1.0  # общий множитель урона всех форм — главная ручка баланса
  # Доля урона по площади, которая проходит сквозь стену. 1.0 = стены не мешают
  # (как было), 0.0 = полное укрытие. Вода умеет заворачивать за угол, поэтому
  # по умолчанию ослабление, а не блокировка.
  through-cover: 0.45

griefing:
  break-blocks: true      # ломать ли пол/блоки при ударах
  # Если ломать нельзя — оставлять ли всё-таки стоячую воду после удара.
  # false = «не переставляй мой мир» действительно означает это.
  flood-without-breaking: false
  # Спрашивать разрешения у плагинов защиты (WorldGuard, GriefPrevention, Towny,
  # Lands...) через ванильное событие взрыва. Зависимостей не требует. Через этот
  # же гейт проходит и ЗАБОР воды, и лёд «Водной Поступи», и коридор «Расступись».
  respect-protection: true
  permanent: true         # ПОСЛЕДСТВИЯ ОСТАЮТСЯ: разрушения и вода не пропадают
  restore-ticks: 1200     # (если permanent=false) через сколько вернуть блоки
  max-break-radius: 7      # ограничение радиуса разрушения
  blacklist:               # эти блоки никогда не трогаются
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - END_PORTAL_FRAME
    - END_PORTAL
    - NETHER_PORTAL
    - REINFORCED_DEEPSLATE
    - OBSIDIAN

effects:
  particles: true
  sounds: true
  # Мастер-множитель громкости всех звуков плагина. Дробовик кладёт до 9 попаданий
  # разом; для записи со голосом полезно приглушить.
  sound-volume: 1.0

items:
  enable-recipes: true     # включить крафты Святой Воды и Тотема
  give-catalyst-on-drink: true  # выдавать Водный Тотем при употреблении Святой Воды
