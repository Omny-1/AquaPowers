# ============================================================
#  AquaPowers — water manipulation (Holy Water)
#  Attack size, damage, and aftermath scale with both the amount
#  of collected water AND the caster's surroundings (see environment).
# ============================================================

# Configuration version — do not edit. Plugin updates only ADD new keys;
# your existing values are preserved, and a backup is still written alongside the file.
config-version: 7

messages:
  prefix: "&b&l⊙ &b"

collect:
  radius: 16              # water search radius in blocks
  duration-ticks: 40      # orb collection duration (20 = 1 second) -> 2 seconds
  # Maximum droplets in an orb. This is the main load control: every droplet is
  # a real entity broadcast by the server to every nearby player. Five benders
  # inside the same tracking radius produce 25 packet streams, not 5.
  max-blocks: 120
  min-blocks: 6           # minimum required to activate an ability
  drain-source: true      # remove real water from the world while collecting
  restore-source-on-disperse: true  # restore water when the orb is dispersed without attacking

orb:
  # Orb palette: "MATERIAL:weight". Mixed shades and white "foam" turn a pile
  # of identical cubes into a body of water.
  # Note: glass is transparent, and many overlapping transparent droplets can
  # produce sorting artifacts while the camera rotates. If it flickers, try
  # opaque materials such as PRISMARINE or PACKED_ICE, at the cost of some watery appearance.
  # A high-contrast palette (dark blue plus white foam) also survives video
  # compression better than three similar shades of light blue.
  palette:
    - "BLUE_STAINED_GLASS:7"
    - "LIGHT_BLUE_STAINED_GLASS:3"
    - "WHITE_STAINED_GLASS:2"
  material: BLUE_STAINED_GLASS   # fallback when the palette is empty
  block-scale: 0.6        # base droplet size; grows with the amount of water
  size-jitter-min: 0.72   # droplet size variation; without it, a visible grid appears
  size-jitter-max: 1.36
  radius: 1.7             # base orb radius; grows with the amount of water
  height-above-head: 1.0  # gap above the head; the orb rises automatically as it grows
  spin-speed: 0.06
  glow: false             # glowing droplet outline (dramatic, but visible through walls)

display:
  # Client-side distance culling. A value of 4.0 made clients RENDER all water
  # across the entire fight, wasting GPU time on droplets distant players could
  # not distinguish anyway. 1.5 is enough to see your own and enemy water in combat.
  view-range: 1.5
  teleport-duration: 2    # how often droplet movement is sent, in ticks
  # 0..15 — fixed brightness. -1 uses lighting from the water's actual position:
  # darker in caves and at night, warmer at sunset.
  brightness: -1

# ---- Load limits. Exceeding them gives an explicit rejection message instead of silent lag ----
limits:
  max-effects: 90            # simultaneous live effects on the server
  max-effects-per-player: 14
  max-displays: 1400         # simultaneous live droplet entities on the server
  restore-batch: 120         # borrowed blocks restored per tick

cooldown-ticks: 10        # delay between form activations

# ---- Stamina: time to refill from 0 to 100 depends on the surrounding attunement ----
# Dry and hot -> refills quickly, but casts are expensive and weak.
# Wet -> refills slowly, but casts are cheap and powerful. See environment.
stamina:
  max: 100.0
  scan-radius: 6
  seconds-near-water: 30  # submerged or near plenty of water
  seconds-on-ground: 15   # ordinary ground
  seconds-on-sand: 10     # sand, desert, or savanna
  seconds-near-lava: 5    # lava, fire, or the Nether

# ---- Attunement: surroundings change both ability COST AND POWER ----
# Immersion ×0.55 cost / ×1.30 power | Downpour ×0.70 / ×1.18
# Flow      ×0.80 / ×1.12 | Balance ×1.00 / ×1.00
# Drought   ×1.30 / ×0.90 (orb evaporates) | Inferno ×1.70 / ×0.78 (evaporates quickly)
# Determined by biome temperature and sky access rather than biome names, so it
# also works with modded biomes. Biomes without precipitation do not get Downpour.
environment:
  enabled: true
  sky-collection: true    # collect an orb without a nearby water source in rain or underwater

# ---- Awakening: builds from damage dealt and decays while idle ----
awakening:
  enabled: true
  threshold: 80.0         # charge required to enter Awakening
  max: 100.0
  charge-per-damage: 1.3  # charge gained per point of damage dealt
  decay-per-sec: 3.0      # charge lost per second without dealing damage
  grace-ticks: 60         # delay after a hit before charge starts decaying
  cost-multiplier: 0.5    # ability cost multiplier during Awakening
  collect-speed-mult: 2.0 # water collection speed multiplier during Awakening
  # Power multiplier. Affects damage, radius, duration, and projectile count;
  # it previously had no effect at all with a full orb.
  power-multiplier: 1.25

# ---- Ultimate "Aqua Armageddon" (Awakening only, requires full stamina) ----
# Arming is FREE and reversible: if not released, all collected water returns to the world.
nuke:
  enabled: true
  radius: 60              # water collection radius; loaded chunks only
  cooldown-seconds: 300   # 5 minutes, measured in server ticks rather than wall-clock time
  break-radius: 22        # destruction radius of the mushroom-cloud blast
  damage: 220.0
  cap-radius: 15          # radius of the mushroom-cloud cap
  height: 32              # height of the mushroom-cloud stem
  # Number of droplets used to render the cloud. The mushroom silhouette is only
  # as readable as this value allows: away from an ocean, only 40 droplets used
  # to remain and the cloud was nearly invisible. Missing droplets "condense from the air."
  cloud-blocks: 340
  cloud-scale: 1.8        # cloud droplet size; larger values produce a denser silhouette
  # The crater is the UNION of many sub-blasts rather than one smooth bowl,
  # producing lobes, ridges between pits, a torn edge, and surviving inner pillars.
  # 0 returns to a single smooth bowl.
  blast-count: 18
  blast-roughness: 0.55   # 0..1 — sub-blast roughness and frequency of surviving pillars

damage:
  enabled: true
  friendly-fire: true     # whether other players can be damaged; also affects who is healed
  global-multiplier: 1.0  # global damage multiplier for all forms; the main balance control
  # Fraction of area damage that passes through a wall. 1.0 means walls do not
  # interfere; 0.0 means complete cover. Water can bend around corners, so the
  # default weakens damage instead of blocking it entirely.
  through-cover: 0.45

griefing:
  break-blocks: true      # whether impacts can break terrain
  # When breaking is disabled, whether impacts may still leave standing water.
  # false makes "do not rearrange my world" mean exactly that.
  flood-without-breaking: false
  # Ask protection plugins (WorldGuard, GriefPrevention, Towny, Lands, etc.) for
  # permission through a vanilla explosion event. No dependency is required.
  # Water collection, Water Walk ice, and the Part the Waters corridor use the same gate.
  respect-protection: true
  permanent: true         # AFTERMATH REMAINS: destruction and water do not disappear
  restore-ticks: 1200     # when permanent=false, delay before restoring blocks
  max-break-radius: 7     # maximum destruction radius
  blacklist:              # these blocks are never modified
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - END_PORTAL_FRAME
    - END_PORTAL
    - NETHER_PORTAL
    - REINFORCED_DEEPSLATE
    - OBSIDIAN

effects:
  particles: true
  sounds: true
  # Master volume multiplier for every plugin sound. Water Shotgun can produce
  # up to 9 impacts at once, so lowering this helps when recording commentary.
  sound-volume: 1.0

items:
  enable-recipes: true     # enable Holy Water and Water Totem recipes
  give-catalyst-on-drink: true  # give a Water Totem when Holy Water is consumed
